<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Help us to protect and preserve our wild animals. Make your donation!">
    <meta name="author" content="Celi Macêdo">
    <title>Contact Us Page</title>

    <!-- Social Media Meta -->
    <meta property="og:title" content="Wild Brazil Contact Page. Developed by Celi MacÊdo">
    <meta property="og:description" content="Brazil Wild takes you to an amazing virtual safari, and teaches you how to protect the Brazilian fauna!">
    <meta property="og:image" content="https://celikmack.github.io/wdd231/project/images/logo.webp">
    <meta property="og:url" content="https://celikmack.github.io/wdd231/project/contact.html"> 

    <!-- Google Fonts Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles and Scripts External Links -->
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/contact.css">
    <link rel="icon" href="favicon.ico">
    
    <script src="scripts/global.js" defer></script>
       
</head>

<body>
    <!-- Background image -->
    <div class="body-bg">
        <img src="images/bg-leaves.webp" class="bg-leaves" alt="A backgorund with multiple types of leaves." aria-hidden="true">
    </div>
    
    <!-- Header -->
    <header>
        <div class="logo">
            <img src="images/logo-wb.webp" alt="Wild Brazil logo" width="100" height="100">
        </div>

        <button id="ham-btn" class="hamburger" aria-label="Open navigation menu"></button>
        <nav class="nav-flex">
            <ul id="navbar" class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="animals.html" >Animals</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    
    <!-- Main Content -->
    <main>
        <!-- Forms -->
        <section class="forms">

            <!-- Contact Us Form -->
            <form action="thankyou.html" method="get" class="contact">
                <h1>Talk to Us!</h1>    
                <label>Full Name*<input type="text" name="full-name" title="Full Name" autocomplete="name" required></label>
                <label>E-mail*<input type="email" name="email" title="Email Address"  autocomplete="email" required></label>             
                <label>Phone*<input type="tel" name="phone" title="Your Phone Number" autocomplete="tel" required></label>             
                <label>Subject*
                    <select name="subject" title="Subject" required>
                        <option value="" disabled selected>Choose an option...</option>
                        <option value="volunteer">I want to be a volunteer</option>
                        <option value="mistreat">Animal mistreat</option>
                        <option value="traffic">Animal illegal traffic/trading</option>
                        <option value="others">Others</option>
                    </select>
                </label>
                <label>Your Message<textarea name="message" title="Your Message" rows="6"></textarea></label>
                <input type="hidden" name="formType" value="contact">
                <button type="submit" class="button">Send My Message!</button>         
            </form>

            <!-- Donation Form -->
            <form action="thankyou.html" method="get" class="donation">
                <h1>Support Wild Brazil!</h1>
                
                <h2>Frequency:</h2>
                <div class="radio-group">
                    <label><input type="radio" id="freq-once" name="frequency" value="one-time" checked /> One time</label>
                    <label><input type="radio" id="freq-monthly" name="frequency" value="monthly" /> Monthly</label>
                </div>

                <h3>Amount:</h3>
                <div class="radio-group">
                    <label><input type="radio" id="donation1" name="donation" value="donation1" checked /> $ 10.00</label>
                    <label><input type="radio" id="donation2" name="donation" value="donation2" /> $ 25.00</label>
                    <label><input type="radio" id="donation3" name="donation" value="donation3" /> $ 50.00</label>
                </div>

                <label>Full Name*<input type="text" name="full-name" title="Full Name" autocomplete="name" required></label>
                <label>Card Type*
                    <select name="card-type" title="Card Type" required>
                        <option value="" disabled selected>Select a Level...</option>
                        <option value="visa">Visa</option>
                        <option value="mc">Mastercard</option>
                        <option value="amex">American Express</option>                    
                    </select>
                </label>
                <label>Card Number*<input type="text" name="card-number" title="Card Number" placeholder="1234 5678 9012 3456" required></label>  
                <label>Expiration Date (MM/YY)*<input type="text" name="expiration" title="Expiration Date" placeholder="MM/YY" pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" required></label>  
                <input type="hidden" name="formType" value="donation">
                <button type="submit" class="button">Donate Now!</button> 
            </form>

        </section>

    </main>

    <!-- Footer-->
    <footer>
        <div class="social">
             <a href="https://www.loom.com/share/c9612df9242c4f27859a8e608830e029" target="_blank" aria-label="Loom"><img src="images/Loom.svg" alt="Loom" width="16" height="16"></a>
            <a href="https://facebook.com/" target="_blank" aria-label="Facebook"><img src="images/facebook.svg" alt="Facebook" width="16" height="16"></a>
            <a href="https://youtube.com/" target="_blank" aria-label="YouTube"><img src="images/youtube.svg" alt="YouTube" width="16" height="16"></a>
            <a href="https://linkedin.com/" target="_blank" aria-label="LinkedIn"><img src="images/linkedin.svg" alt="Twitter-X" width="16" height="16"></a>
            <a href="https://x.com/" target="_blank" aria-label="Twitter-X"><img src="images/twitter-x.svg" alt="Twitter-X" width="16" height="16"></a>
        </div>
        <p>&copy; 2026 🪸 Celi Macêdo 🪸 Brazil</p>
    </footer>
    
</body>
</html>
