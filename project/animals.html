<head>

    <!-- Styles and Scripts External Links -->

    <link rel="stylesheet" href="styles/animals.css">
    <link rel="icon" href="favicon.ico">

<body>
    <!-- Background image -->
    <div class="body-bg">
        <img src="images/bg-leaves.webp" class="bg-leaves" alt="A backgorund with multiple types of leaves." aria-hidden="true">
    </div>
    
    <!-- Header -->
    <header>
        <div class="logo">
            <img src="images/logo-wb.webp" alt="Wild Brazil logo" width="100" height="100">
        </div>
        
        <button id="ham-btn" class="hamburger" aria-label="Open navigation menu"></button>
        <nav class="nav-flex">
            <ul id="navbar" class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="animals.html" class="active">Animals</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    
    <!-- Main Content -->
    <main>
        <!-- Filter Buttons -->
        <section class="filter-section">
            <h1>Meet some of the thousands of Brazilian exotic animals!</h1>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="mammal">Mammals</button>
                <button class="filter-btn" data-filter="bird">Birds</button>
                <button class="filter-btn" data-filter="reptile">Reptiles</button>
                <button class="filter-btn" data-filter="amphibian">Amphibians</button>
                <button class="filter-btn" data-filter="fish">Fishes</button>
            </div>
            </section>
            <!-- Animal Cards Section-->
            <div id="flex-container" class="flex">
                <!-- Dynamic cards will be injected here by JavaScript -->
            </div>

    <!-- Footer -->
    <footer>
        <div class="social">
            <a href="https://facebook.com/" target="_blank" aria-label="Facebook"><img src="images/facebook.svg" alt="Facebook" width="16" height="16"></a>

        </div>
